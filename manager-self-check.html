<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일하는 관리자 자가진단 — Cobalt Architect</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF6EE; color: #101012; font-family: -apple-system, 'Noto Sans KR', sans-serif; line-height: 1.7; padding: 24px 16px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .sub { font-size: 14px; color: #555; margin-bottom: 24px; }
  .q { border: 1.5px solid #101012; background: #fff; padding: 18px; margin-bottom: 14px; }
  .q h3 { font-size: 15px; margin-bottom: 12px; }
  .opt { display: flex; gap: 8px; margin-top: 8px; }
  .opt button { flex: 1; padding: 10px 8px; border: 1.5px solid #101012; background: #fff; font-size: 14px; cursor: pointer; }
  .opt button.sel { background: #193A8A; color: #fff; }
  #result { display: none; border: 2px solid #193A8A; background: #fff; padding: 24px; margin-top: 24px; }
  #result h2 { font-size: 19px; color: #193A8A; margin-bottom: 12px; }
  #result p { font-size: 15px; margin-bottom: 10px; }
  #calc { width: 100%; padding: 14px; background: #193A8A; color: #fff; border: none; font-size: 16px; cursor: pointer; margin-top: 8px; }
  #reset { width: 100%; padding: 12px; background: #fff; border: 1.5px solid #101012; font-size: 14px; cursor: pointer; margin-top: 10px; }
  .foot { text-align: center; font-size: 12px; color: #888; margin-top: 32px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>일하는 관리자 자가진단</h1>
  <p class="sub">6가지 질문에 답하면, 지금 내 관리 스타일이 어디에 가까운지 알려 드립니다.</p>
  <div style="border:1.5px solid #101012;background:#fff;padding:14px;margin-bottom:20px;font-size:13px;">
    <strong>유형 안내</strong><br>
    A — 일하는 관리자 (플레잉 코치형): 직접 일하면서 이끄는 방향. 좋은 쪽입니다.<br>
    B — 전환 중인 관리자: 절반은 일하고 절반은 맡기는 중간 단계입니다.<br>
    C — 손을 놓고 있는 관리자: 지시와 보고 위주. 주의가 필요한 방향입니다.
  </div>
  <div id="quiz"></div>
  <button id="calc">결과 보기</button>
  <div id="result"></div>
  <button id="reset" style="display:none">다시 하기</button>
  <p class="foot">Copyright (c) 2026 Cobalt Architect</p>
</div>
<script>
const QS = [
  { q: "이번 주에 내가 직접 만든 결과물이 있나요? (보고서, 자료, 시제품 등)", a: "직접 만들었다", b: "없다, 지시만 했다" },
  { q: "팀원이 하는 일을 구체적으로 알고 있나요?", a: "어떤 방식으로 하는지 안다", b: "결과만 받는다" },
  { q: "현장 이야기를 중간 단계 없이 직접 듣나요?", a: "직접 듣는다", b: "보고로만 듣는다" },
  { q: "내 하루 중 결재·보고·회의 자료에 쓰는 시간은?", a: "절반 이하", b: "절반 이상" },
  { q: "AI 도구를 직접 써서 일을 해 본 적이 있나요?", a: "있다, 자주 쓴다", b: "없다, 남이 해 준다" },
  { q: "팀원의 고민을 들을 때, 내 경험으로 조언할 수 있나요?", a: "직접 해 봐서 안다", b: "들어만 준다" }
];
let ans = Array(QS.length).fill(null);
const quiz = document.getElementById('quiz');
QS.forEach((item, i) => {
  const d = document.createElement('div');
  d.className = 'q';
  d.innerHTML = '<h3>' + (i+1) + '. ' + item.q + '</h3><div class="opt"><button data-i="' + i + '" data-v="a">' + item.a + '</button><button data-i="' + i + '" data-v="b">' + item.b + '</button></div>';
  quiz.appendChild(d);
});
quiz.addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  const i = +e.target.dataset.i, v = e.target.dataset.v;
  ans[i] = v;
  const btns = e.target.parentElement.querySelectorAll('button');
  btns.forEach(b => b.classList.remove('sel'));
  e.target.classList.add('sel');
});
document.getElementById('calc').addEventListener('click', () => {
  if (ans.includes(null)) { alert('모든 질문에 답해 주세요.'); return; }
  const score = ans.filter(v => v === 'a').length;
  let title, body, level;
  if (score >= 5) {
    level = '유형 A — 일하는 관리자';
    title = '플레잉 코치형';
    body = '<p><strong>좋은 방향입니다.</strong> 직접 일하면서 팀을 이끄는 스타일입니다. 현장의 언어로 말하고, 손으로 해 본 경험을 바탕으로 판단합니다.</p><p><strong>유지할 것:</strong> 지금의 리듬을 지키되, 번아웃에 주의하세요. 모든 일을 직접 하려 하면 지칩니다. 맡길 일과 직접 할 일을 구분하는 것도 관리입니다.</p><p><strong>다음 단계:</strong> AI 도구를 관리하는 법을 팀에 공유해 보세요. 내가 터득한 방식을 다른 사람도 쓸 수 있게 만드는 것이 리더의 일입니다.</p>';
  } else if (score >= 3) {
    level = '유형 B — 전환 중인 관리자';
    title = '절반은 일하고, 절반은 맡기고 있습니다';
    body = '<p><strong>중간 단계입니다.</strong> 실무 감각은 있지만, 서류와 회의에 시간을 많이 빼앗기고 있을 수 있습니다. 이대로 가면 어느 쪽으로도 갈 수 있습니다.</p><p><strong>좋은 방향으로 가려면:</strong> AI가 거들 수 있는 일부터 찾아보세요. 자료 모으기, 형식 맞추기, 빠진 것 찾기부터 맡기면 현장에 쓸 시간이 생깁니다.</p><p><strong>나쁜 방향으로 가면:</strong> 서류가 더 늘어나고 현장이 더 멀어집니다. 보고만 받는 관리자가 되기 쉽습니다.</p>';
  } else {
    level = '유형 C — 손을 놓고 있는 관리자';
    title = '지시와 보고 위주로 일하고 있습니다';
    body = '<p><strong>주의가 필요합니다.</strong> 현장과 멀어지면 판단이 어긋나기 쉽습니다. 체스키가 말한 "사람만 관리하는 관리자"에 가까워지고 있을 수 있습니다.</p><p><strong>좋은 방향으로 가려면:</strong> 내일, 팀원이 하는 일 하나를 직접 해 보세요. 자료 하나를 직접 살펴보는 것부터 시작하면 됩니다. 작은 일부터 손에 익히는 것이 중요합니다.</p><p><strong>이대로 두면:</strong> AI 시대에 관리자의 자리가 좁아질 수 있습니다. 직접 해 본 경험이 없으면 AI가 내놓은 결과도 제대로 판단하기 어렵습니다.</p>';
  }
  const r = document.getElementById('result');
  r.innerHTML = '<p style="font-size:13px;color:#888;margin-bottom:4px;">' + level + '</p><h2>' + title + '</h2>' + body + '<p style="color:#888;font-size:13px;margin-top:16px;">' + score + '/6개 항목에서 직접 일하는 쪽에 답했습니다. A로 갈수록 일하는 관리자에 가깝습니다.</p>';
  r.style.display = 'block';
  document.getElementById('reset').style.display = 'block';
  document.getElementById('calc').style.display = 'none';
  r.scrollIntoView({ behavior: 'smooth' });
});
document.getElementById('reset').addEventListener('click', () => {
  ans = Array(QS.length).fill(null);
  document.querySelectorAll('.opt button').forEach(b => b.classList.remove('sel'));
  document.getElementById('result').style.display = 'none';
  document.getElementById('reset').style.display = 'none';
  document.getElementById('calc').style.display = 'block';
});
</script>
</body>
</html>
