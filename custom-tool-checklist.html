<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맞춤 도구 타당성 체크리스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #FAF6EE; color: #101012; line-height: 1.6; padding: 20px; max-width: 600px; margin: 0 auto; }
  h1 { font-size: 1.4em; margin-bottom: 8px; }
  .subtitle { color: #555; margin-bottom: 24px; font-size: 0.95em; }
  .question { background: #fff; border: 1.5px solid #101012; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .question h3 { font-size: 1em; margin-bottom: 8px; }
  .question p { font-size: 0.9em; color: #555; margin-bottom: 12px; }
  .options { display: flex; gap: 8px; }
  .options button { flex: 1; padding: 10px; border: 1.5px solid #101012; border-radius: 6px; background: #FAF6EE; cursor: pointer; font-size: 0.95em; }
  .options button.selected { background: #193A8A; color: #fff; border-color: #193A8A; }
  #result { display: none; margin-top: 24px; padding: 20px; border: 2px solid #193A8A; border-radius: 8px; background: #fff; }
  #result h2 { color: #193A8A; margin-bottom: 12px; }
  #result p { margin-bottom: 8px; }
  #reset { margin-top: 16px; padding: 10px 20px; border: 1.5px solid #101012; border-radius: 6px; background: #FAF6EE; cursor: pointer; }
  .progress { text-align: center; margin-bottom: 16px; color: #555; font-size: 0.9em; }
</style>
</head>
<body>
<h1>맞춤 도구 타당성 체크리스트</h1>
<p class="subtitle">이 일을 맞춤 도구로 만들 만한지, 여섯 가지 질문으로 따져봅니다.</p>
<div class="progress" id="progress">0 / 6 완료</div>
<div id="questions"></div>
<div id="result">
  <h2 id="result-title"></h2>
  <p id="result-desc"></p>
  <button id="reset" onclick="reset()">다시 하기</button>
</div>

<script>
const questions = [
  {
    q: "1. 이 일을 얼마나 자주 하나요?",
    desc: "자주 할수록 맞춤의 값이 내려갑니다. 한 번 하고 말 일에 맞춤 도구는 비쌉니다.",
    options: ["매일", "주 1-2회", "월 1회 이하"]
  },
  {
    q: "2. 기성 도구에서 불편한 점이 구체적으로 있나요?",
    desc: "\"뭔가 불편해\"가 아니라, 어디가 어떻게 불편한지 말할 수 있어야 합니다.",
    options: ["구체적으로 안다", "어렴풋이 안다", "잘 모르겠다"]
  },
  {
    q: "3. 그 불편함이 어디서 오는지 정확히 아나요?",
    desc: "맞춤복에서 어려운 건 바느질보다 치수를 재는 일입니다. 무엇이 필요한지 아는 게 먼저입니다.",
    options: ["정확히 안다", "대충 안다", "모른다"]
  },
  {
    q: "4. 만든 뒤에 지킬 여력이 있나요?",
    desc: "맞춤 도구는 만들 때보다 지킬 때 품이 듭니다. 고치고 챙길 여력이 있어야 합니다.",
    options: ["있다", "조금 있다", "없다"]
  },
  {
    q: "5. 실제 일에 넣어 보고 확인할 수 있나요?",
    desc: "겉으로 잘 돌아가는 것과 실제 일에서 쓸모 있는 것은 다릅니다. 확인하는 건 사람 몫입니다.",
    options: ["할 수 있다", "어렵다", "못 한다"]
  },
  {
    q: "6. 이 일이 전체에서 가장 오래 걸리는 부분인가요?",
    desc: "하루 일의 1%를 10배 빠르게 해도 하루는 거의 그대로입니다. 가장 오래 걸리는 곳부터 맞춰야 합니다.",
    options: ["그렇다", "중간 정도다", "아니다"]
  }
];

const scores = [
  [2, 1, 0],
  [2, 1, 0],
  [2, 1, 0],
  [2, 1, 0],
  [2, 1, 0],
  [2, 1, 0]
];

let answers = new Array(6).fill(-1);

function render() {
  const container = document.getElementById('questions');
  container.innerHTML = '';
  questions.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<h3>${item.q}</h3><p>${item.desc}</p><div class="options"></div>`;
    const opts = div.querySelector('.options');
    item.options.forEach((opt, j) => {
      const btn = document.createElement('button');
      btn.textContent = opt;
      if (answers[i] === j) btn.classList.add('selected');
      btn.onclick = () => { answers[i] = j; render(); checkComplete(); };
      opts.appendChild(btn);
    });
    container.appendChild(div);
  });
  const done = answers.filter(a => a >= 0).length;
  document.getElementById('progress').textContent = `${done} / 6 완료`;
}

function checkComplete() {
  if (answers.every(a => a >= 0)) {
    const total = answers.reduce((sum, a, i) => sum + scores[i][a], 0);
    const result = document.getElementById('result');
    const title = document.getElementById('result-title');
    const desc = document.getElementById('result-desc');
    result.style.display = 'block';
    if (total >= 10) {
      title.textContent = "만들어 볼 만합니다 (" + total + "/12점)";
      desc.textContent = "치수를 잴 준비가 되어 있습니다. 작게 시작해서 실제 일에 넣어 보고 확인하세요.";
    } else if (total >= 6) {
      title.textContent = "좀 더 따져보세요 (" + total + "/12점)";
      desc.textContent = "맞춤의 값어치가 아직 분명하지 않습니다. 불편한 점을 더 구체적으로 적어 보고, 가장 오래 걸리는 부분인지 다시 확인해 보세요.";
    } else {
      title.textContent = "기성복으로 충분합니다 (" + total + "/12점)";
      desc.textContent = "지금은 맞춤 도구를 만들 때가 아닙니다. 잘 만든 기성 도구를 고르는 눈을 기르는 쪽이 낫습니다.";
    }
    result.scrollIntoView({ behavior: 'smooth' });
  }
}

function reset() {
  answers = new Array(6).fill(-1);
  document.getElementById('result').style.display = 'none';
  render();
}

render();
</script>
</body>
</html>
